name: release
# Builds the distributable .iinaplgz + the minimal LGPL FFmpeg binaries and
# publishes them as a GitHub Release. Triggered by pushing a tag: v1.0.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  plugin:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: brew install ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:helper
      - run: npm run build
      - name: Pack .iinaplgz
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/pack.js --out "dist/iina-llm-subtitle-${GITHUB_REF_NAME}.iinaplgz"
      - uses: actions/upload-artifact@v4
        with:
          name: iinaplgz
          path: dist/*.iinaplgz

  ffmpeg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build minimal LGPL FFmpeg (arm64 + x86_64 + universal)
        env:
          FFMPEG_VERSION: "8.1.2"
        run: |
          chmod +x scripts/build-ffmpeg-minimal.sh
          scripts/build-ffmpeg-minimal.sh universal
      - name: Checksums
        run: |
          cd dist/ffmpeg-tools
          for f in universal/ffmpeg universal/ffprobe; do
            shasum -a 256 "$f" >> SHA256SUMS
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-tools
          path: |
            dist/ffmpeg-tools/universal/ffmpeg
            dist/ffmpeg-tools/universal/ffprobe
            dist/ffmpeg-tools/SHA256SUMS

  release:
    needs: [plugin, ffmpeg]
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Organize release assets
        run: |
          mkdir -p release
          cp artifacts/iinaplgz/*.iinaplgz release/
          cp artifacts/ffmpeg-tools/ffmpeg release/ffmpeg
          cp artifacts/ffmpeg-tools/ffprobe release/ffprobe
          cp artifacts/ffmpeg-tools/SHA256SUMS release/SHA256SUMS
          cp THIRD_PARTY_NOTICES.md release/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "iina-llm-subtitle $GITHUB_REF_NAME" \
            --generate-notes \
            release/*
