name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: brew install ffmpeg
      - run: npm run build:helper
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
