<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Key</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 13px -apple-system, sans-serif; margin: 24px; }
    label, input { display: block; }
    input { box-sizing: border-box; width: 100%; margin-top: 8px; padding: 6px; }
    p { line-height: 1.5; }
    button { margin-right: 8px; }
    #status { min-height: 20px; }
  </style>
</head>
<body>
  <form id="credentialsForm">
    <label for="apiKey">API Key</label>
    <input id="apiKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
    <p id="help">The key is saved only in a local file readable by your account. Leave blank to remove the saved key.</p>
    <button id="save" type="submit">Save</button><button id="close" type="button">Close</button>
    <p id="status" role="status"></p>
  </form>
  <script>
    const zh = (navigator.language || "en").toLowerCase().startsWith("zh");
    const input = document.getElementById("apiKey");
    const save = document.getElementById("save");
    const status = document.getElementById("status");
    if (zh) {
      document.documentElement.lang = "zh-Hans";
      document.getElementById("help").textContent = "密钥仅保存在当前账户可读取的本地文件中。留空保存可移除已保存的密钥。";
      save.textContent = "保存";
      document.getElementById("close").textContent = "关闭";
    }
    function reset() { input.value = ""; status.textContent = ""; save.disabled = false; }
    window.iina.onMessage("reset", reset);
    window.iina.onMessage("saved", function (data) {
      input.value = "";
      save.disabled = false;
      status.textContent = data.configured ? (zh ? "已保存。" : "Saved.") : (zh ? "密钥已移除。" : "Key removed.");
    });
    window.iina.onMessage("save-error", function () {
      save.disabled = false;
      status.textContent = zh ? "保存失败，请重试或检查插件安装。" : "Could not save. Retry or check the plugin installation.";
    });
    document.getElementById("credentialsForm").addEventListener("submit", function (event) {
      event.preventDefault();
      save.disabled = true;
      status.textContent = zh ? "正在保存…" : "Saving…";
      window.iina.postMessage("save", { apiKey: input.value.trim() });
      input.value = "";
    });
    document.getElementById("close").addEventListener("click", function () { reset(); window.iina.postMessage("close", {}); });
    window.iina.postMessage("ready", { path: decodeURIComponent(window.location.pathname) });
  </script>
</body>
</html>
