name: release
# Builds the distributable .iinaplgz + the minimal LGPL FFmpeg binaries and
# publishes them as a GitHub Release. Triggered by pushing a tag: v1.0.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  plugin:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: brew install ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:helper
      - run: npm run build
      - name: Pack .iinaplgz
        run: |
          node scripts/pack.js --out "dist/iina-llm-subtitle-${GITHUB_REF_NAME}.iinaplgz"
      - uses: actions/upload-artifact@v4
        with:
          name: iinaplgz
          path: dist/*.iinaplgz

  ffmpeg:
    runs-on: macos-14
    env:
      FFMPEG_VERSION: "8.1.2"
    steps:
      - uses: actions/checkout@v4
      - name: Build minimal LGPL FFmpeg (arm64 + x86_64 + universal)
        run: |
          chmod +x scripts/build-ffmpeg-minimal.sh
          scripts/build-ffmpeg-minimal.sh universal
      - name: Verify release assets
        run: |
          cd dist/ffmpeg-tools/release
          shasum -a 256 -c SHA256SUMS
          test -s COPYING.FFmpeg.LGPLv2.1
          test -s "ffmpeg-${FFMPEG_VERSION}.tar.xz"
          test -s build-ffmpeg-minimal.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-tools
          path: dist/ffmpeg-tools/release/*
          if-no-files-found: error

  release:
    needs: [plugin, ffmpeg]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Organize release assets
        run: |
          mkdir -p release
          cp artifacts/iinaplgz/*.iinaplgz release/
          cp artifacts/ffmpeg-tools/* release/
          cd release
          shasum -a 256 -c SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "iina-llm-subtitle $GITHUB_REF_NAME" \
            --generate-notes \
            release/*
